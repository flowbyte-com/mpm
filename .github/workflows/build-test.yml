name: build-and-test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Two-job split is intentional. The "gate" job must pass for merge; it covers
# the build and the migration-relevant test subset. The "full-suite" job runs
# the entire test tree but is allowed to fail — it exists to track the
# pre-existing test-pollution failures (see TestLessonStoreListLessons,
# TestRenderRoute) until the test suite cleanup arc lands. When the noise is
# fixed, promote full-suite to a gating job by removing `continue-on-error`.

jobs:
  gate:
    name: Build + core tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.1'
          cache: true

      - name: Build
        run: go build ./...

      - name: go vet
        run: go vet ./...

      # Same regex as .git/hooks/pre-commit. Keep them in sync: if the pre-commit
      # gate gets tighter locally, it gets tighter in CI too.
      - name: Core tests (synthesis, reliability, lifecycle, hybrid, wake context)
        run: cd internal/core && go test -short -count=1 ./... -run "TestSynthesis|TestReliability|TestLifecycle|TestHybrid|TestGetRecentUserTopics"

      - name: Run full test suite with coverage
        env:
          CGO_ENABLED: 1
          CGO_CFLAGS: "-DSQLITE_ENABLE_FTS5=1"
        run: |
          # Run tests and write atomic coverage profile
          go test -tags fts5 -race -count=1 -covermode=atomic -coverprofile=coverage.out ./...

          # Print per-function and total coverage percentage to workflow logs
          go tool cover -func=coverage.out

      - name: Generate Workflow Step Summary
        run: |
          echo "### 🧪 Go Test Coverage Summary" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          go tool cover -func=coverage.out | tail -n 15 >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload coverage profile
        uses: actions/upload-artifact@v4
        with:
          name: mpm-coverage-report
          path: coverage.out
          retention-days: 14

  full-suite:
    name: Full test suite (tracking only)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.1'
          cache: true

      - name: Full test sweep
        run: go test -count=1 ./... 2>&1 | tee test-output.log
