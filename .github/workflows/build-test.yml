name: build-and-test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Superseded-run cancellation.
#
# Without this, pushing a new commit to a PR starts a fresh run while the
# previous one keeps burning runner minutes to a conclusion nobody will
# read — the previous head's result is obsolete the moment the new one
# starts. The group is per-workflow and per-ref, so:
#
#   * a new push to a PR cancels that PR's in-flight run;
#   * a new push to main cancels main's in-flight run;
#   * two different PRs never cancel each other.
#
# The run that survives is the one for the newest commit, and it executes
# every check the workflow defines — nothing is skipped, shortened or
# relaxed. This reclaims wasted minutes; it does not weaken the gate.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Three-job split is intentional. The "gate" job must pass for merge; it
# covers the build, the migration-relevant test subset, the renderer
# parity tests, the scripts/tests/ installer-contract suite, the
# root-module race-detector sweep with coverage, and the nested
# `internal/core/tools` race-detector sweep. The "full-suite" job
# sweeps the entire test tree without the race detector and is also
# gating. The "release-gate" job runs `make release-gate`, which is
# `test-release` (the cross-agent continuity / public-CLI subprocess
# suite that `go test ./...` from the root cannot reach because
# release_acceptance is a separate Go module) chained with `test-race`
# (so it also exercises the race-detector sweep, the scripts/tests
# suite, and the per-adapter test suites including the mpm-opencode
# TypeScript gate). That intentional duplication is contractually
# pinned by `scripts/tests/test_makefile_agent_adapter_wiring.py`
# TestGateReachability; the job's npm-bootstrap step is therefore
# scoped to release-gate alone, because the `gate` and `full-suite`
# jobs do not reach `test-agent-installation`.
# release_acceptance itself is intentionally NOT folded into the
# gate job — its cases spawn real subprocesses of $(BUILD_DIR)/mpm,
# so the cost is one full e2e sweep per case, and pre-merge-in-
# every-save is the wrong place for it.
#
# It used to be `continue-on-error: true`, on the stated grounds that it was
# tracking "pre-existing test-pollution failures (see TestLessonStoreListLessons,
# TestRenderRoute)". That reasoning was stale on two counts, and the run history
# shows it: in run 37958953946 every full-suite failure — 26 of them, the whole
# set — was `developer build artifact missing: .../.build/bin/mpm`, the CLI
# subprocess tests refusing to fall back to the installed binary. Neither named
# test appears in any failure list. Worse, `continue-on-error` is invisible from
# the job list: that job's conclusion reads `success` while its own log shows
# `FAIL github.com/flowbyte-com/mpm/cmd/mpm 400.696s`. The gate job was red for
# the same missing-build reason (`test_build_output_directory_exists`: ".build/bin
# must exist (run `make build` first)").
#
# Both jobs now run `make build` first, which is the actual fix; verified
# locally in a clean checkout that `go test -tags fts5 -count=1 ./...` exits 0
# once the artifacts exist. Re-add `continue-on-error` only alongside a named
# test in this comment, and only if that name appears in the job's own log.

env:
  # FTS5 must be enabled for mattn/go-sqlite3 — see Makefile. Pin these at
  # the workflow level so every step inherits them, instead of repeating
  # per-step env: blocks.
  #
  # CGO_LDFLAGS=-lm is required because sqlite3-binding.c (which bundles
  # FTS5's bm25) calls log(), which lives in libm. Modern dev hosts link
  # libm implicitly so the Makefile's bare -tags fts5 build works locally,
  # but the GitHub Actions ubuntu-latest runner doesn't — without -lm the
  # link step fails with "undefined reference to `log`". Pin it here.
  CGO_ENABLED: "1"
  CGO_CFLAGS: "-DSQLITE_ENABLE_FTS5=1"
  CGO_LDFLAGS: "-lm"

jobs:
  gate:
    name: Build + core tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          # Bumped from 1.26.1 to 1.26.6 on 2026-08-17 (commit cf66916
          # raised the go.mod minimum to match the Dependabot audit
          # close-out). Keep this pin in lock-step with the `go` directive
          # in go.mod — `GOTOOLCHAIN=local` below refuses to auto-fetch,
          # so a stale pin here fails the build with "go.mod requires
          # go >= X (running go Y; GOTOOLCHAIN=local)".
          go-version: '1.26.6'
          cache: true

      # Some downstream steps (full-suite job, changelog scripts, future
      # release-please integration) need a stable git identity. Configure
      # it once at the workflow level so child steps don't have to.
      - name: Configure git identity
        run: |
          git config --global user.name "mpm-bot"
          git config --global user.email "bot@users.noreply.github.com"
          git config --global init.defaultBranch main

      - name: Build
        run: |
          go build -tags fts5 ./...
          # `make build` is what puts artifacts where the CLI subprocess
          # tests expect them: cmd/mpm and cmd/mpm-critic execute
          # $(BUILD_DIR)/mpm and deliberately refuse to fall back to the
          # installed production binary. `go build ./...` above cannot
          # supply that — with several main packages it compiles all of
          # them and discards every result, leaving no file on disk. The
          # "Run `make build` first" failure those tests emit was
          # therefore reachable from a clean runner, which is why this
          # step exists separately from the compile check.
          make build

      - name: go vet
        run: go vet -tags fts5 ./...

      # Consolidated AST audit gate — mirrors `go run ./cmd/mpm-lint --gate`
      # in .git/hooks/pre-commit. Nine rules in one parse: scans, closes, tx,
      # ctx, go, mutex, sql, fd, imports. Fatal classes are zero-tolerance;
      # review classes ratchet against measured baselines so any NEW site
      # fails the commit. Keep in sync with scripts/pre-commit.
      #
      # Annotations: build once, then emit ::error workflow commands from the
      # structured JSON so every violation renders on its exact line in the
      # PR "Files changed" view (file paths in the report are relative to
      # $GITHUB_WORKSPACE, which the annotations property maps directly).
      # The gate step fails the job only if thresholds are exceeded.
      - name: mpm-lint gate
        shell: bash
        run: |
          go build -tags fts5 -o /tmp/mpm-lint ./cmd/mpm-lint
          /tmp/mpm-lint --json > /tmp/mpm-lint-report.json
          python3 - <<'EOF'
          import json
          report = json.load(open("/tmp/mpm-lint-report.json"))
          for rule, doc in report.items():
              for site in doc["sites"] or []:
                  msg = site.get("reason") or site["classification"]
                  if site.get("pattern"):
                      msg += f" {site['pattern']}"
                  if site.get("func_name"):
                      msg += f" ({site['func_name']})"
                  print(f"::error file={site['file']},line={site['line']},col={site.get('column', 1)}::{rule}: {msg}")
          EOF
          /tmp/mpm-lint --gate

      # Same regex as .git/hooks/pre-commit. Keep them in sync: if the pre-commit
      # gate gets tighter locally, it gets tighter in CI too.
      #
      # TestDBSafety is the repo-wide production-DB guard. It must stay in
      # this list: it previously skipped under -short, and both this step
      # and `make test-core-precommit` pass -short, so a skip here meant the
      # guard never ran in either real gate. It is also not -run-scoped in
      # a way that matters — the guard resolves the repo root and walks all
      # five Go modules, so running it from internal/core still covers
      # cmd/mpm, internal/scheduler, internal/core/tools, and
      # release_acceptance.
      - name: Core tests (synthesis, reliability, lifecycle, hybrid, wake context, DB safety)
        # -tags fts5 is required on every invocation even though CGO_CFLAGS is
        # pinned at workflow level: the C flag and the Go build tag are
        # independent, and only the C flag can be inherited. Without the tag
        # this step compiles the non-FTS5 driver path — which the -run filter
        # below happens to tolerate today, so the omission was invisible until
        # a selected test started asserting on FTS5 behaviour.
        run: cd internal/core && go test -short -count=1 -tags fts5 ./... -run "TestSynthesis|TestReliability|TestLifecycle|TestHybrid|TestGetRecentUserTopics|TestDBSafety"

      # Managed-block parity gate (Python; closes a pre-existing CI gap).
      #
      # Full discover over agent_installation/tests/ — 123 cases
      # covering canonical extraction, per-host prefix substitution,
      # copy/paste example parity, byte-for-byte rendered-vs-checked-in
      # match, cross-adapter content invariants (each adapter's snippet
      # must teach the agent to invoke mpm_work with create/complete
      # actions), installer smoke tests, and live behavioural verification.
      #
      # The 2026-09-06 fix closed the pre-existing
      # test_mentions_mpm_work_with_real_actions failures (Claude and
      # Hermes) by moving the §5 prose to parens form so the renderer
      # applies the prefix, and updated the semantic-guard test that
      # was pinning the old behavior. With that fix, `discover tests`
      # is fully green — both the byte-for-byte parity check and the
      # cross-adapter contract check run in this step.
      #
      # Verified locally: 123/123 OK on clean tree; FAILED (1) on
      # simulated one-character drift; restored on revert.
      - name: Renderer parity (managed-block byte-for-byte)
        run: cd agent_installation && python3 -m unittest discover tests

      # scripts/tests/ (24 files, ~139 cases) pins the installer contract
      # (binary transaction ordering, systemd umask, deploy path resolution,
      # runtime asset provisioning). It used to be reachable only via
      # `make test`/`make test-race` locally — `make test-scripts` is
      # already wired into both — and was completely absent from CI, so
      # an installer-contract regression could land via a green PR. This
      # step closes that gap. Non-vacuity floor (SCRIPTS_TEST_MIN_TESTS)
      # is enforced inside the Makefile target itself, not here.
      - name: Installer contract (scripts/tests)
        run: make test-scripts

      # bench/tests/ (Issue #16 — embedding benchmark harness). 75
      # hermetic tests covering workspace isolation, env scrubbing,
      # corpus provenance, regeneration verification, per-query
      # participation, raw-cosine ranking, labelled-relevance scoring,
      # provider-aware query embedding, and adversarial regression
      # shapes. Pure Python; no mpm binary, no live DB, no real
      # network. Reachable from CI for the first time via this step;
      # `make test-bench` is also wired into `make test` and
      # `make test-race` so the local gates reach it. Non-vacuity
      # floor (BENCH_TEST_MIN_TESTS) is enforced inside the Makefile
      # target itself, not here.
      - name: Embedding benchmark harness (bench/tests)
        run: make test-bench

      - name: Run full test suite with coverage
        run: |
          # Run tests and write atomic coverage profile
          #
          # -timeout 20m: Go's default per-test-binary budget is 10m, and
          # cmd/mpm is the largest package in the tree. Measured under the
          # race detector on a two-core runner it takes 530-600s, so the
          # default leaves no headroom and turns the gate into a
          # coin flip on which runner the job lands on. This matches
          # CMD_TEST_TIMEOUT in the Makefile (see the comment there); it is
          # a harness budget only and weakens no assertion.
          go test -tags fts5 -race -timeout 20m -count=1 -covermode=atomic -coverprofile=coverage.out ./...

          # Print per-function and total coverage percentage to workflow logs
          go tool cover -func=coverage.out

      # internal/core/tools is a separate Go module, so `./...` from the repo
      # root never descends into it. Until this step the whole MCP tool layer —
      # ~50s of tests including the output-policy, registry/dispatcher parity,
      # and adapter schema guards — was invisible to a green CI result. Race
      # coverage matches the step above; the module builds and passes clean
      # under -race locally.
      - name: Nested tools module (internal/core/tools)
        run: make test-tools-race

      - name: Generate Workflow Step Summary
        # shell: bash for the same reason as the full-suite sweep: this
        # step pipes `go tool cover` into `tail`, and without pipefail a
        # failure of `go tool cover` would be swallowed. This step does
        # not gate anything by itself, but a step whose failure is
        # invisible is the habit that hides the ones that do.
        shell: bash
        run: |
          echo "### 🧪 Go Test Coverage Summary" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          go tool cover -func=coverage.out | tail -n 15 >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload coverage profile
        uses: actions/upload-artifact@v7
        with:
          name: mpm-coverage-report
          path: coverage.out
          retention-days: 14

  full-suite:
    name: Full test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          # See the gate job above for the bump rationale (2026-08-17).
          go-version: '1.26.6'
          cache: true

      # `./...` excludes internal/core/tools (separate go.mod). Sweep it
      # separately so this job's log covers the whole tree, not the root module.
      #
      # `make build` runs first for the same reason as in the gate job: the
      # CLI subprocess tests under cmd/mpm execute $(BUILD_DIR)/mpm and
      # refuse to fall back to the installed binary. Without it every clean
      # runner reports the same "developer build artifact missing" failures,
      # which drowns the real signal this job exists to surface.
      - name: Build
        run: make build

      - name: Full test sweep
        # shell: bash (NOT the default) is REQUIRED here, and it is the
        # whole point of this step.
        #
        # GitHub Actions runs a `run:` step with the default shell
        # `bash -e {0}` — errexit only, NO pipefail. It applies
        # `-o pipefail` ONLY when the step opts in with `shell: bash`
        # (`bash --noprofile --norc -eo pipefail {0}`). Under the default
        # shell, `go test ... | tee test-output.log` reports the exit
        # status of `tee`, which is 0, so a FAILING test sweep could not
        # fail this step: the job read `success` while its own log showed
        # `FAIL github.com/flowbyte-com/mpm/cmd/mpm`. The sweep was
        # therefore decorative — it printed a log, it did not gate
        # anything.
        #
        # `shell: bash` restores the gate: pipefail makes the pipeline's
        # status the failure of any element in it, so a failing `go test`
        # or a failing `make test-tools` fails the step and the job. This
        # ADDS verification; it removes none.
        shell: bash
        run: |
          # -timeout 20m: same reason as the gate job above — cmd/mpm's
          # suite is the dominant cost of this sweep and Go's default
          # 10m per-test-binary budget leaves no headroom for it. Matches
          # CMD_TEST_TIMEOUT in the Makefile.
          go test -tags fts5 -timeout 20m -count=1 ./... 2>&1 | tee test-output.log
          make test-tools 2>&1 | tee tools-output.log

  release-gate:
    name: Release gate (cross-agent continuity + public-CLI subprocess suite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          # See the gate job above for the bump rationale (2026-08-17).
          go-version: '1.26.6'
          cache: true

      # Node 20 LTS. The mpm-opencode TypeScript suite (17 .test.ts
      # files compiled to .test.js via the adapter-local tsc, run by
      # `make test-agent-adapters`) requires `engines.node: ">=20"`
      # per agent_installation/mpm-opencode/package.json. Node 20 is
      # the LTS that satisfies the package.json floor and matches the
      # version the project has been validated against on the
      # ubuntu-24.04 GitHub Actions runner. Caching is keyed to the
      # lockfile path so a clean-checkout rebuild under `npm ci`
      # reuses the warm cache.
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'agent_installation/mpm-opencode/package-lock.json'

      # `make release-gate` -> `test-race` -> `test-agent-installation`
      # -> `test-agent-adapters` reaches the mpm-opencode TypeScript
      # suite, which compiles its `.test.ts` via the adapter-local
      # `node_modules/.bin/tsc`. The Makefile gate fails closed if
      # that binary is missing (it deliberately does NOT fall back to
      # a globally installed tsc). `npm ci` populates devDependencies
      # from the tracked lockfile (added in commit 0ec2810 alongside
      # the V2 integration) and is idempotent. This step is scoped to
      # the release-gate job because the `gate` and `full-suite` jobs
      # do not reach `test-agent-installation`; adding it there would
      # be a redundant download.
      - name: Bootstrap OpenCode TypeScript devDependencies
        run: npm ci
        working-directory: agent_installation/mpm-opencode

      # release_acceptance is a separate Go module (its own go.mod), so
      # `go test ./...` from the repo root cannot descend into it.
      # `make release-gate` runs `test-release` (the cross-agent
      # continuity / public-CLI subprocess suite) AND `test-race` (the
      # race-detector suite with `test-scripts` and
      # `test-agent-installation` chained in). The `gate` job already
      # runs `test-scripts` and a race-detector sweep; the deliberate
      # duplication here exists because the release-gate target was
      # contractually pinned as a comprehensive sweep that reaches
      # `test-agent-installation` and `test-agent-adapters` (see
      # scripts/tests/test_makefile_agent_adapter_wiring.py
      # TestGateReachability, added in 467d520). The non-vacuity
      # floors (AGENT_INSTALL_TEST_MIN_TESTS, RELEASE_TEST_MIN_TESTS)
      # are enforced inside the recipes themselves, not here, so a
      # sabotaged module cannot be reported as a green run. `make
      # release-gate` depends on `build`, so the subprocess tests get
      # a fresh $(BUILD_DIR)/mpm without a separate `make build`
      # step.
      - name: Release gate
        run: make release-gate